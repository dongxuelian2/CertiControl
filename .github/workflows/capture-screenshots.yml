name: Capture demo screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/capture-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CertiControl app and Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[app]" playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start Streamlit
        run: |
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/streamlit.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1

      - name: Capture real UI screenshots
        run: python .github/scripts/capture_screenshots.py

      - name: Finalize screenshot assets
        run: python .github/scripts/finalize_screenshots.py

      - name: Verify screenshot dimensions
        run: python -c "from pathlib import Path; from PIL import Image; files=[Path('docs/images')/n for n in ('overview.png','lqr.png','kalman.png')]; print([(p.name, Image.open(p).size, p.stat().st_size) for p in files]); assert all(Image.open(p).size[0] >= 1600 and Image.open(p).size[1] >= 800 for p in files)"

      - name: Commit high-resolution screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/images
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "docs: replace compressed screenshots with high-resolution captures"
          git push
