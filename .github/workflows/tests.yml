name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Validate Streamlit Cloud requirements
        run: python -m pip install -r requirements.txt
      - name: Install test extras
        run: python -m pip install -e ".[test,app]"
      - run: python -m compileall -q src app.py app_helpers.py
      - run: python -c "import certicontrol; import app"
      - name: Streamlit startup smoke
        shell: bash
        run: |
          streamlit run app.py --server.headless true --server.port 8501 >/tmp/certicontrol-streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/certicontrol-streamlit.log
          exit 1
      - run: pytest -q
